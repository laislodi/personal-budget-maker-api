services:
  - type: web
    name: personal-budget-maker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m seed.defaults && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: budget-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.0"
    plan: free

databases:
  - name: budget-db
    plan: free
